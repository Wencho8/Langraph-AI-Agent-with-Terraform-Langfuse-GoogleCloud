name: agent-chatbot-gcloud

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-chatbot-password}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chatbot}:${POSTGRES_PASSWORD:-local-chatbot-password}@db:5432/${POSTGRES_DB:-chatbot}
      APP_ENV: ${APP_ENV:-local}
      AUTH_MODE: ${AUTH_MODE:-session}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      AUTH_LOGIN_LIMIT: ${AUTH_LOGIN_LIMIT:-10}
      AUTH_REGISTRATION_LIMIT: ${AUTH_REGISTRATION_LIMIT:-5}
      MAX_ACTIVE_TURNS: ${MAX_ACTIVE_TURNS:-4}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-20}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      TURN_TIMEOUT_SECONDS: ${TURN_TIMEOUT_SECONDS:-30}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-20}
      SIMULATED_CHUNK_DELAY_SECONDS: ${SIMULATED_CHUNK_DELAY_SECONDS:-0.04}
      MODEL: ${MODEL-simulated}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-2048}
      TOOL_TIMEOUT_SECONDS: ${TOOL_TIMEOUT_SECONDS:-5}
      MAX_MODEL_CALLS: ${MAX_MODEL_CALLS:-4}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-8}
      GRAPH_RECURSION_LIMIT: ${GRAPH_RECURSION_LIMIT:-12}
    ports:
      - "127.0.0.1:${API_PORT:-8088}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 15
      start_period: 5s

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 4s
      retries: 15

volumes:
  postgres_data:
