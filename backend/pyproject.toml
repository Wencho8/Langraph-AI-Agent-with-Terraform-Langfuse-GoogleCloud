[project]
name = "agent-chatbot-gcloud"
version = "0.1.0"
description = "A small async chatbot backend for learning Google Cloud."
requires-python = ">=3.13,<3.14"
dependencies = [
    "anyio>=4.6,<5",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1",
    "cloud-sql-python-connector[asyncpg]>=1.18,<2",
    "alembic>=1.14,<2",
    "langgraph>=1.0,<2",
    "openai>=2,<3",
    "jsonschema>=4.23,<5",
    "argon2-cffi>=25.1,<26",
    "langfuse>=5,<6",
    "opentelemetry-sdk>=1.33,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
